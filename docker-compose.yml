version: '3.8'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: diamond_db
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'
  api:
    build: ./diamond-connect-api
    env_file:
      - .env
    environment:
      - FACE_DETECTION_STRICT=true
    ports:
      - '5001:5001'
    depends_on:
      - db
      - redis

volumes:
  db_data:
